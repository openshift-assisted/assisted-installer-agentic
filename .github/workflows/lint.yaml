name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build validation image
        run: docker build --file Dockerfile.assisted-installer-agentic-validation --tag assisted-installer-agentic-validation:ci .
      - name: Run validation
        run: >-
          docker run --rm --network host
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}"
            --workdir "${GITHUB_WORKSPACE}"
            assisted-installer-agentic-validation:ci
            make validate
